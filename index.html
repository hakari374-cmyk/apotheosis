<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1a140d" />
<meta name="description" content="The Apollo System — 7 Facets, Rank progression E→S, Daily Architecture, and the Financial Blueprint." />
<title>Apollo System</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ─── Design tokens ───────────────────────────────────────────── */
  :root{
    --bg:oklch(.16 .012 60);
    --bg-2:oklch(.19 .014 60);
    --card:oklch(.205 .016 65);
    --card-elev:oklch(.235 .018 65);
    --border:oklch(.78 .13 80 / .10);
    --border-hi:oklch(.78 .13 80 / .26);
    --gold:oklch(.78 .13 80);
    --gold-bright:oklch(.86 .13 85);
    --amber:oklch(.7 .15 55);
    --cream:oklch(.92 .04 80);
    --mut:oklch(.62 .04 70);
    --mut-deep:oklch(.4 .03 65);
    --grn:oklch(.7 .14 145);
    --red:oklch(.62 .18 25);
    --blu:oklch(.62 .13 250);
    --font-display:"Cinzel",Georgia,serif;
    --font-serif:"Crimson Pro",Georgia,serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
    --nav-h:calc(64px + env(safe-area-inset-bottom));
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:var(--font-serif);overscroll-behavior:none;}
  body{
    min-height:100dvh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%,oklch(.78 .13 80 / .05) 0%,transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 110%,oklch(.7 .15 55 / .04) 0%,transparent 60%);
    padding-bottom:var(--nav-h);
    padding-top:env(safe-area-inset-top);
  }
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:.02em;margin:0;font-weight:600;}
  p{margin:0;}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
  input,textarea{font-family:inherit;color:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ─── Layout ──────────────────────────────────────────────────── */
  .app{max-width:560px;margin:0 auto;padding:20px 18px 28px;}
  .app-page{animation:fadein .18s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .stack > * + *{margin-top:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mut{color:var(--mut);}
  .small{font-size:12px;}
  .tiny{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  /* ─── Cards ───────────────────────────────────────────────────── */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.03);
  }
  .gold-grad{
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
    white-space:nowrap;
  }
  .pill.gold{color:var(--gold);border-color:var(--border-hi);}
  .pill.grn{color:var(--grn);border-color:oklch(.7 .14 145 / .35);}

  /* ─── Header ──────────────────────────────────────────────────── */
  header.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:12px;}
  .brand-title{font-family:var(--font-display);font-size:22px;letter-spacing:.18em;flex-shrink:0;}
  .brand-title em{font-style:normal;}

  /* ─── Rank ring ───────────────────────────────────────────────── */
  .ring{
    position:relative;width:104px;height:104px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(255,255,255,.04) 0);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px var(--border-hi),0 0 24px oklch(.78 .13 80 / .14);
    transition:background .4s;
  }
  .ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card);}
  .ring > div{position:relative;z-index:1;text-align:center;}
  .ring .rank{font-family:var(--font-display);font-size:32px;line-height:1;}
  .ring .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-top:4px;}

  /* ─── Bars ────────────────────────────────────────────────────── */
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .3s;}

  /* ─── Checklist ───────────────────────────────────────────────── */
  .check{
    width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;
    padding:12px;border-radius:12px;background:rgba(255,255,255,.02);
    border:1px solid var(--border);transition:border-color .15s,background .15s;
  }
  .check:hover{border-color:var(--border-hi);}
  .check:active{background:rgba(255,255,255,.04);}
  .check.done{background:rgba(212,176,90,.07);border-color:var(--border-hi);}
  .check .box{
    flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mut-deep);
    display:flex;align-items:center;justify-content:center;margin-top:2px;
    transition:background .15s,border-color .15s;
  }
  .check.done .box{background:var(--gold);border-color:var(--gold);color:var(--bg);}
  .check.done .box::after{content:"✓";font-weight:700;font-size:14px;}
  .check .time{font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.08em;}
  .check .label{font-family:var(--font-display);font-size:15px;margin-top:2px;}
  .check .detail{font-size:13px;color:var(--mut);margin-top:2px;}

  /* ─── Buttons ─────────────────────────────────────────────────── */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 16px;border-radius:10px;font-family:var(--font-display);
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid var(--border-hi);color:var(--cream);background:rgba(255,255,255,.02);
    transition:background .14s,opacity .14s;
  }
  .btn:hover{background:rgba(255,255,255,.05);}
  .btn:active{opacity:.8;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-bright));color:var(--bg);border-color:transparent;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:var(--border);color:var(--mut);}
  .btn-danger{border-color:rgba(180,60,40,.4);color:var(--red);}

  /* ─── Inputs ──────────────────────────────────────────────────── */
  .inp{
    width:100%;padding:10px 12px;border-radius:10px;
    background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--cream);
    font-family:var(--font-serif);font-size:14px;outline:none;
    -webkit-appearance:none;appearance:none;
  }
  .inp:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px oklch(.78 .13 80 / .08);}
  /* Fix select on Safari — force dark bg */
  select.inp{background-color:oklch(.18 .013 62);color-scheme:dark;}
  label.lbl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;}

  /* ─── Facet tile ──────────────────────────────────────────────── */
  .facet{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);}
  .facet .numeral{font-family:var(--font-display);font-size:22px;color:var(--gold);min-width:30px;}
  .facet .name{font-family:var(--font-display);font-size:15px;}
  .facet .tag{font-size:12px;color:var(--mut);font-style:italic;margin-top:2px;}

  /* ─── Stepper ─────────────────────────────────────────────────── */
  .stepper{display:flex;align-items:center;margin-top:10px;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:rgba(0,0,0,.2);}
  .stepper__btn{flex:none;width:48px;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;font-family:var(--font-display);color:var(--gold);background:rgba(255,255,255,.03);border:none;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .12s;}
  .stepper__btn:hover{background:rgba(212,176,90,.12);}
  .stepper__btn:active{background:rgba(212,176,90,.24);}
  .stepper__track{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;}
  .stepper__val{font-family:var(--font-mono);font-size:18px;color:var(--gold-bright);line-height:1;font-variant-numeric:tabular-nums;}
  .stepper__bar{width:80%;height:3px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;}
  .stepper__fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .2s;}

  /* ─── Code lines ──────────────────────────────────────────────── */
  .code-line{
    padding:10px 14px;border-left:2px solid var(--gold);
    background:rgba(212,176,90,.04);font-style:italic;font-size:14px;color:var(--cream);
    border-radius:0 8px 8px 0;
  }
  .code-line + .code-line{margin-top:8px;}

  /* ─── Buckets ─────────────────────────────────────────────────── */
  .bucket{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:10px;}
  .bucket + .bucket{border-top:1px solid var(--border);}
  .bucket .binfo{flex:1;min-width:0;}
  .bucket .name{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;}
  .bucket .pct{font-size:11px;color:var(--mut);}
  .bucket .amt{font-family:var(--font-mono);font-size:14px;color:var(--gold);flex-shrink:0;}
  .bucket .bbar{height:3px;border-radius:999px;background:rgba(255,255,255,.06);margin-top:4px;overflow:hidden;}
  .bucket .bbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-bright));}

  /* ─── Rank list ───────────────────────────────────────────────── */
  .rank-row{display:flex;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);}
  .rank-row.active{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,176,90,.08),transparent);}
  .rank-row .badge{
    flex:none;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:18px;
    background:rgba(255,255,255,.03);border:1px solid var(--border-hi);color:var(--gold);
  }
  .rank-row.active .badge{background:linear-gradient(135deg,var(--gold),var(--gold-bright));color:var(--bg);border-color:transparent;}

  /* ─── Bottom nav ──────────────────────────────────────────────── */
  nav.bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:oklch(.16 .012 60 / .94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bottom ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;}
  nav.bottom button{
    width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
    transition:color .15s;
  }
  nav.bottom button.active{color:var(--gold);}
  nav.bottom .ico{font-family:var(--font-display);font-size:14px;display:block;line-height:1.3;}
  nav.bottom button.active .ico-dot{display:block;}
  .ico-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin:0 auto;display:none;}

  /* ─── Income list ─────────────────────────────────────────────── */
  .inc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);}
  .inc:first-child{border-top:0;}
  .inc .iname{font-family:var(--font-display);font-size:13px;}
  .inc .meta{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
  .inc .amt{font-family:var(--font-mono);color:var(--gold);font-size:14px;}
  .inc .del{font-size:11px;color:var(--red);margin-left:10px;padding:4px 10px;border-radius:6px;border:1px solid rgba(180,60,40,.3);transition:background .12s;}
  .inc .del:hover{background:rgba(180,60,40,.12);}

  /* ─── Stream tags ─────────────────────────────────────────────── */
  .stream-tag{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(212,176,90,.1);color:var(--gold);border:1px solid var(--border-hi);}
  .stream-tag.tutoring{background:rgba(100,160,220,.08);color:var(--blu);border-color:oklch(.62 .13 250 / .3);}
  .stream-tag.content{background:rgba(100,200,130,.06);color:var(--grn);border-color:oklch(.7 .14 145 / .3);}
  .stream-tag.other{background:rgba(255,255,255,.04);color:var(--mut);border-color:var(--border);}

  /* ─── Misc ────────────────────────────────────────────────────── */
  .hr-rule{height:1px;background:linear-gradient(90deg,transparent,var(--border-hi),transparent);margin:18px 0;}
  .scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .scroll-x::-webkit-scrollbar{display:none;}
  .chip{flex:none;padding:6px 14px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--mut);font-family:var(--font-display);letter-spacing:.06em;transition:all .14s;}
  .chip.on{color:var(--gold);border-color:var(--border-hi);background:rgba(212,176,90,.06);}
  .ul-clean{list-style:none;padding:0;margin:0;}
  .ul-clean li{padding:6px 0;font-size:13px;color:var(--cream);position:relative;padding-left:14px;}
  .ul-clean li::before{content:"•";color:var(--gold);position:absolute;left:0;top:6px;}
  .divider{height:1px;background:var(--border);margin:14px 0;}

  /* ─── Toast ───────────────────────────────────────────────────── */
  #toast{
    position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%) translateY(-10px);
    background:var(--card-elev);border:1px solid var(--border-hi);
    color:var(--cream);padding:10px 18px;border-radius:10px;font-size:13px;
    box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:200;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    white-space:nowrap;font-family:var(--font-display);letter-spacing:.06em;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.toast-err{border-color:rgba(180,60,40,.5);color:var(--red);}

  /* ─── Confirm overlay ─────────────────────────────────────────── */
  .confirm-box{
    margin-top:12px;padding:12px;border-radius:10px;
    background:rgba(180,60,40,.06);border:1px solid rgba(180,60,40,.3);
    display:none;
  }
  .confirm-box.show{display:block;}
  .confirm-box p{font-size:13px;color:var(--cream);margin-bottom:10px;}
  .confirm-box .row{gap:8px;}

  /* ─── Quote card ──────────────────────────────────────────────── */
  .quote-card{
    border-left:3px solid var(--gold);padding:12px 14px;
    background:rgba(212,176,90,.04);border-radius:0 10px 10px 0;
    font-style:italic;font-size:15px;color:var(--cream);line-height:1.55;
  }

  /* ─── Vault stats ─────────────────────────────────────────────── */
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);}
  .stat-row:first-child{border-top:0;padding-top:0;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast"></div>

<nav class="bottom">
  <ul id="nav">
    <li><button data-tab="home"><span class="ico">☉</span>Home<span class="ico-dot"></span></button></li>
    <li><button data-tab="system"><span class="ico">VII</span>System<span class="ico-dot"></span></button></li>

</nav>

<script>

// ─── DATA ─────────────────────────────────────────────────────────

 {key:"mind",numeral:"I",name:"The Mind",tagline:"Philosophical depth. The architecture of thought.",

 {key:"E",title:"E — The Awakening",summary:"The system is new. The work is unmistakable. Survive Week 1.",
  grad:["14 consecutive days of daily architecture","Morning pages every day","Body training 3x/week without missing","The code written, posted somewhere only you see"]},
 {key:"D",title:"D — The Builder",summary:"The pattern stabilises. Output begins. Privately.",

 {key:"S",title:"S — Undeniable",summary:"Not a destination. A level of being from which you continue to build indefinitely.",

const THE_CODE=[
 "I do not chase. I become.",

 "Comfort is a slow grave. I refuse it.",

 "I am building something the world has no name for yet."
];

const DAILY=[
 {id:"wake",time:"05:30",label:"Wake. No phone.",detail:"Water. Sunlight. Silence."},
 {id:"pages",time:"05:45",label:"Morning Pages",detail:"3 pages longhand. Unedited."},
 {id:"meditations",time:"06:15",label:"Meditations",detail:"One entry. Read twice."},
 {id:"train",time:"06:30",label:"Train the Body",detail:"Six movements. Progressive overload."},

const KEY="apollo.state.v2";

// Use local date string (YYYY-MM-DD) in the device's local timezone — avoids
// UTC-midnight drift that makes streaks break at midnight in UTC+2.
function todayISO(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function fmtDate(iso){
  if(!iso)return"";
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-NA",{weekday:"short",month:"short",day:"numeric"});
}

  streak:{current:0,best:0,lastDate:null},
  rankCond:{}
};

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(!r)return structuredClone(initial);
    const p=JSON.parse(r);
    return Object.assign(structuredClone(initial),p,{
      facets:Object.assign({},initial.facets,p.facets||{}),
      buckets:Object.assign({},initial.buckets,p.buckets||{})
    });
  }catch(e){return structuredClone(initial);}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

// ─── TOAST ────────────────────────────────────────────────────────
let _toastTimer=null;
function toast(msg,isErr=false){
  const el=document.getElementById("toast");
  if(!el)return;
  el.textContent=msg;
  el.className="show"+(isErr?" toast-err":"");
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{el.className="";},2200);
}

// ─── STREAK HELPERS ───────────────────────────────────────────────
function prevDay(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()-1);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}

function recomputeStreak(){
  // After unchecking a block, recalculate streak from scratch across stored days
  const today=todayISO();
  const days=Object.keys(state.daily).sort().reverse();
  let cur=0,best=state.streak.best,lastDate=null;
  let cursor=today;
  for(const day of days){
    if(day>today)continue;
    const done=Object.values(state.daily[day]?.blocks||{}).filter(Boolean).length;
    if(done>=7){
      if(day===cursor){cur++;lastDate=lastDate||day;cursor=prevDay(cursor);}
      else if(day<cursor)break;
    }
  }
  best=Math.max(best,cur);
  state.streak={current:cur,best,lastDate};
}

// ─── ACTIONS ──────────────────────────────────────────────────────
function setFacet(k,v,skipRender){
  state.facets[k]=Math.max(0,Math.min(100,v|0));
  save();
  if(!skipRender)render();
}

function toggleBlock(id){
  const d=todayISO();
  state.daily[d]=state.daily[d]||{blocks:{}};
  const wasOn=!!state.daily[d].blocks[id];
  state.daily[d].blocks[id]=!wasOn;
  const doneCt=Object.values(state.daily[d].blocks).filter(Boolean).length;
  if(!wasOn && doneCt===7){
    // Just hit 7 — update streak forward
    const yesterday=prevDay(d);
    const cur=state.streak.lastDate===yesterday?state.streak.current+1:
               state.streak.lastDate===d?state.streak.current:1;
    state.streak={current:cur,best:Math.max(state.streak.best,cur),lastDate:d};
  } else if(wasOn && doneCt===6){
    // Dropped below 7 — recompute fully
    recomputeStreak();
  }
  save();render();
}

function toggleCode(){const d=todayISO();state.codeCheck[d]=!state.codeCheck[d];save();render();}

function addIncome(stream,amountStr,note){
  const amount=parseFloat(String(amountStr).replace(/,/g,"."));
  if(!amount||amount<=0){toast("Enter a valid amount",true);return;}
  const id=Math.random().toString(36).slice(2,10);
  state.income.unshift({id,date:todayISO(),stream,amount,note:note||""});
  state.income=state.income.slice(0,500);
  BUCKETS.forEach(b=>state.buckets[b.key]=(state.buckets[b.key]||0)+amount*b.pct/100);
  save();render();
  toast("N$"+amount.toLocaleString("en-NA",{maximumFractionDigits:0})+" logged ✓");
}

function removeIncome(id){
  const t=state.income.find(e=>e.id===id);if(!t)return;
  BUCKETS.forEach(b=>state.buckets[b.key]=Math.max(0,(state.buckets[b.key]||0)-t.amount*b.pct/100));
  state.income=state.income.filter(e=>e.id!==id);
  save();render();
  toast("Entry removed");
}

function setRank(k){state.rank=k;save();render();}
function toggleRankCond(k,i){const key=k+":"+i;state.rankCond[key]=!state.rankCond[key];save();render();}

function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;
  a.download="apollo-state-"+todayISO()+".json";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
  toast("Exported ✓");
}

function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      state=Object.assign(structuredClone(initial),p,{
        facets:Object.assign({},initial.facets,p.facets||{}),
        buckets:Object.assign({},initial.buckets,p.buckets||{})
      });
      save();render();toast("Data imported ✓");
    }catch(e){toast("Import failed — invalid file",true);}
  };
  r.readAsText(file);
}

  const checked=Object.values(state.rankCond).filter(Boolean).length;
  return `<div class="app-page">
    <header class="brand"><div class="brand-title">THE <em class="gold-grad">·</em> VAULT</div><div class="pill">DATA</div></header>

    <div class="card">
      <div class="tiny">Storage</div>
      <h3 style="font-size:16px;margin-top:4px;">Everything lives on this device.</h3>
      <p class="small mut" style="margin-top:6px;">No accounts. No cloud. Export to back up. Import to restore.</p>
      <div class="grid-2" style="margin-top:14px;">
        <button class="btn btn-gold" id="exp">Export JSON</button>
        <button class="btn" id="impTrigger">Import JSON</button>
        <input id="imp" type="file" accept="application/json" style="display:none" />
      </div>
      <div class="hr-rule"></div>
      <button class="btn btn-ghost" id="rstBtn" style="width:100%;">Reset all data…</button>
      <div class="confirm-box" id="confirmBox">
        <p>This permanently erases all Apollo data on this device. There is no undo.</p>
        <div class="row">
          <button class="btn btn-danger" id="rstConfirm" style="flex:1;">Erase everything</button>
          <button class="btn btn-ghost" id="rstCancel" style="flex:1;">Cancel</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="tiny" style="margin-bottom:10px;">At a Glance</div>
      <div class="stat-row"><span class="mut small">Current rank</span><span class="num">${state.rank}</span></div>
      <div class="stat-row"><span class="mut small">Overall facet score</span><span class="num">${overall()} / 100</span></div>
      <div class="stat-row"><span class="mut small">Current streak</span><span class="num">${state.streak.current}d</span></div>
      <div class="stat-row"><span class="mut small">Best streak</span><span class="num">${state.streak.best}d</span></div>
      <div class="stat-row"><span class="mut small">Days tracked</span><span class="num">${days}</span></div>
      <div class="stat-row"><span class="mut small">Income entries</span><span class="num">${state.income.length}</span></div>
      <div class="stat-row"><span class="mut small">Total income logged</span><span class="num">${fmt(totalIncome())}</span></div>
      <div class="stat-row"><span class="mut small">Rank conditions met</span><span class="num">${checked}</span></div>
    </div>

    <div class="card">
      <div class="tiny">The Apollo Code</div>
      <div class="stack" style="margin-top:10px;">${THE_CODE.map(l=>`<div class="code-line">${l}</div>`).join("")}</div>
    </div>
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────
function render(){
  const views={home:viewHome,system:viewSystem,money:viewMoney,rank:viewRank,vault:viewVault};
  $("#app").innerHTML=(views[tab]||viewHome)();
  document.querySelectorAll("#nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===tab);
  });
  bind();
  window.scrollTo({top:0,behavior:"instant"});
}

function bind(){
  // Daily checklist
  document.querySelectorAll("[data-block]").forEach(el=>el.onclick=()=>toggleBlock(el.dataset.block));

  // Facet steppers
  document.querySelectorAll("[data-facet-dec]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.facetDec;
    setFacet(k,state.facets[k]-5,true);
    syncStepper(k);
  });
  document.querySelectorAll("[data-facet-inc]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.facetInc;
    setFacet(k,state.facets[k]+5,true);
    syncStepper(k);
  });

  // Rank chips — visual browse only
  document.querySelectorAll("[data-rank]").forEach(el=>el.onclick=()=>{
    document.querySelectorAll("[data-rank]").forEach(c=>c.classList.remove("on"));
    el.classList.add("on");
  });
  document.querySelectorAll("[data-setrank]").forEach(el=>el.onclick=()=>setRank(el.dataset.setrank));
  document.querySelectorAll("[data-rcond]").forEach(el=>el.onclick=()=>{
    const[k,i]=el.dataset.rcond.split(":");toggleRankCond(k,+i);
  });

  // Income
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>removeIncome(el.dataset.del));
  const ib=$("#incBtn");
  if(ib){
    const doLog=()=>{
      const s=$("#incStream").value;
      const a=$("#incAmount").value;
      const n=$("#incNote").value;
      addIncome(s,a,n);
      // addIncome calls render() on success, so no need to clear manually
    };
    ib.onclick=doLog;
    // Allow Enter in amount/note fields to submit
    ["#incAmount","#incNote"].forEach(sel=>{
      const el=$(sel);if(el)el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doLog();}};
    });
  }

  // Code check
  const cb=$("#codeBtn");if(cb)cb.onclick=toggleCode;

  // Vault
  const ex=$("#exp");if(ex)ex.onclick=exportJSON;
  const impT=$("#impTrigger");if(impT)impT.onclick=()=>$("#imp")&&$("#imp").click();
  const im=$("#imp");if(im)im.onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);};
  const rstBtn=$("#rstBtn");if(rstBtn)rstBtn.onclick=()=>{
    const box=$("#confirmBox");if(box)box.classList.toggle("show");
  };
  const rstConfirm=$("#rstConfirm");if(rstConfirm)rstConfirm.onclick=()=>resetAll();
  const rstCancel=$("#rstCancel");if(rstCancel)rstCancel.onclick=()=>{
    const box=$("#confirmBox");if(box)box.classList.remove("show");
  };
}

function syncStepper(k){
  const v=state.facets[k];
  const num=document.getElementById("fnum-"+k);
  const bar=document.getElementById("fbar-"+k);
  const val=document.getElementById("fval-"+k);
  if(num)num.textContent=v;
  if(bar)bar.style.width=v+"%";
  if(val)val.textContent=v;
}

// ─── NAV ──────────────────────────────────────────────────────────
document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick=()=>{tab=b.dataset.tab;location.hash=tab;render();};
});
window.addEventListener("hashchange",()=>{
  const t=location.hash.replace("#","");
  if(["home","system","money","rank","vault"].includes(t)){tab=t;render();}
});

render();

// ─── PWA ──────────────────────────────────────────────────────────
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
