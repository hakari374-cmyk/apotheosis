<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<title>Apollo System</title>

<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ─── Apollo dark+gold design tokens ──────────────────────────── */
  :root{
    --bg:oklch(.16 .012 60);
    --bg-2:oklch(.19 .014 60);
    --card:oklch(.205 .016 65);
    --card-elev:oklch(.235 .018 65);
    --border:oklch(.78 .13 80 / .10);
    --border-hi:oklch(.78 .13 80 / .26);
    --gold:oklch(.78 .13 80);
    --gold-bright:oklch(.86 .13 85);
    --amber:oklch(.7 .15 55);
    --cream:oklch(.92 .04 80);
    --mut:oklch(.62 .04 70);
    --mut-deep:oklch(.4 .03 65);
    --grn:oklch(.7 .14 145);
    --red:oklch(.62 .18 25);
    --blu:oklch(.62 .13 250);
    --font-display:"Cinzel",Georgia,serif;
    --font-serif:"Crimson Pro",Georgia,serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:var(--font-serif);overscroll-behavior:none;}
  body{
    min-height:100dvh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%,oklch(.78 .13 80 / .05) 0%,transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 110%,oklch(.7 .15 55 / .04) 0%,transparent 60%);
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
  }
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:.02em;margin:0;font-weight:600;}
  p{margin:0;}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
  input,textarea,select{font-family:inherit;color:inherit;}
  a{color:inherit;text-decoration:none;}

  /* ─── Layout ──────────────────────────────────────────────────── */
  .app{max-width:560px;margin:0 auto;padding:20px 18px 24px;}
  .stack > * + *{margin-top:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mut{color:var(--mut);}
  .small{font-size:12px;}
  .tiny{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  /* ─── Cards ───────────────────────────────────────────────────── */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.03);
  }
  .card-elev{background:var(--card-elev);}
  .gold-grad{
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  }
  .pill.gold{color:var(--gold);border-color:var(--border-hi);}
  .divider{height:1px;background:var(--border);margin:14px 0;}

  /* ─── Header ──────────────────────────────────────────────────── */
  header.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .brand-title{font-family:var(--font-display);font-size:22px;letter-spacing:.18em;}
  .brand-title em{font-style:normal;}

  /* ─── Rank ring ───────────────────────────────────────────────── */
  .ring{
    position:relative;width:104px;height:104px;border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(255,255,255,.04) 0);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px var(--border-hi),0 0 24px oklch(.78 .13 80 / .14);
  }
  .ring::after{
    content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card);
  }
  .ring > div{position:relative;z-index:1;text-align:center;}
  .ring .rank{font-family:var(--font-display);font-size:32px;line-height:1;}
  .ring .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-top:4px;}

  /* ─── Bars ────────────────────────────────────────────────────── */
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));}

  /* ─── Checklist ───────────────────────────────────────────────── */
  .check{
    width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;
    padding:12px;border-radius:12px;background:rgba(255,255,255,.02);
    border:1px solid var(--border);transition:border-color .15s,background .15s;
  }
  .check:hover{border-color:var(--border-hi);}
  .check.done{background:rgba(212,176,90,.07);border-color:var(--border-hi);}
  .check .box{
    flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mut-deep);
    display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .check.done .box{background:var(--gold);border-color:var(--gold);color:var(--bg);}
  .check.done .box::after{content:"✓";font-weight:700;font-size:14px;}
  .check .time{font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.08em;}
  .check .label{font-family:var(--font-display);font-size:15px;margin-top:2px;}
  .check .detail{font-size:13px;color:var(--mut);margin-top:2px;}

  /* ─── Buttons ─────────────────────────────────────────────────── */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 16px;border-radius:10px;font-family:var(--font-display);
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid var(--border-hi);color:var(--cream);background:rgba(255,255,255,.02);
  }
  .btn:hover{background:rgba(255,255,255,.05);}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-bright));color:var(--bg);border-color:transparent;}
  .btn-ghost{border-color:var(--border);color:var(--mut);}
  .btn-danger{border-color:rgba(180,60,40,.4);color:var(--red);}

  /* ─── Inputs ──────────────────────────────────────────────────── */
  .inp{
    width:100%;padding:10px 12px;border-radius:10px;
    background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--cream);
    font-family:var(--font-serif);font-size:14px;outline:none;
  }
  .inp:focus{border-color:var(--border-hi);}
  label.lbl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;}

  /* ─── Facet tile ──────────────────────────────────────────────── */
  .facet{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);}
  .facet .numeral{font-family:var(--font-display);font-size:22px;color:var(--gold);min-width:30px;}
  .facet .name{font-family:var(--font-display);font-size:15px;}
  .facet .tag{font-size:12px;color:var(--mut);font-style:italic;margin-top:2px;}
  /* ─── Stepper (replaces sliders) ─────────────────────────────── */
  .stepper{display:flex;align-items:center;gap:0;margin-top:10px;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:rgba(0,0,0,.2);}
  .stepper__btn{flex:none;width:46px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;font-family:var(--font-display);color:var(--gold);background:rgba(255,255,255,.03);border:none;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .12s;}
  .stepper__btn:hover{background:rgba(212,176,90,.12);}
  .stepper__btn:active{background:rgba(212,176,90,.22);}
  .stepper__track{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;}
  .stepper__val{font-family:var(--font-mono);font-size:16px;color:var(--gold-bright);line-height:1;}
  .stepper__bar{width:100%;height:3px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;}
  .stepper__fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .15s;}

  /* ─── Code lines ──────────────────────────────────────────────── */
  .code-line{
    padding:10px 14px;border-left:2px solid var(--gold);
    background:rgba(212,176,90,.04);font-style:italic;font-size:14px;color:var(--cream);
    border-radius:0 8px 8px 0;
  }
  .code-line + .code-line{margin-top:8px;}

  /* ─── Bucket bar ──────────────────────────────────────────────── */
  .bucket{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
  .bucket + .bucket{border-top:1px solid var(--border);}
  .bucket .name{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;}
  .bucket .pct{font-size:11px;color:var(--mut);}
  .bucket .amt{font-family:var(--font-mono);font-size:14px;color:var(--gold);}

  /* ─── Rank list ───────────────────────────────────────────────── */
  .rank-row{display:flex;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);}
  .rank-row.active{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,176,90,.08),transparent);}
  .rank-row .badge{
    flex:none;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:18px;
    background:rgba(255,255,255,.03);border:1px solid var(--border-hi);color:var(--gold);
  }
  .rank-row.active .badge{background:linear-gradient(135deg,var(--gold),var(--gold-bright));color:var(--bg);border-color:transparent;}

  /* ─── Bottom nav ──────────────────────────────────────────────── */
  nav.bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(20,16,10,.92);backdrop-filter:blur(18px);
    border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;}
  nav.bottom button{
    width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  }
  nav.bottom button.active{color:var(--gold);}
  nav.bottom .ico{font-family:var(--font-display);font-size:14px;}

  /* ─── Income entry list ───────────────────────────────────────── */
  .inc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);}
  .inc:first-child{border-top:0;}
  .inc .meta{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;}
  .inc .amt{font-family:var(--font-mono);color:var(--gold);font-size:14px;}
  .inc .del{font-size:11px;color:var(--red);margin-left:8px;padding:4px 8px;border-radius:6px;border:1px solid rgba(180,60,40,.3);}

  /* ─── Misc ────────────────────────────────────────────────────── */
  .hr-rule{height:1px;background:linear-gradient(90deg,transparent,var(--border-hi),transparent);margin:18px 0;}
  .scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .scroll-x::-webkit-scrollbar{display:none;}
  .chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--mut);}
  .chip.on{color:var(--gold);border-color:var(--border-hi);background:rgba(212,176,90,.06);}
  .ul-clean{list-style:none;padding:0;margin:0;}
  .ul-clean li{padding:6px 0;font-size:13px;color:var(--cream);position:relative;padding-left:14px;}
  .ul-clean li::before{content:"•";color:var(--gold);position:absolute;left:0;top:6px;}
</style>
</head>

<div class="app" id="app"></div>

<nav class="bottom">

<script>
/* ============================================================
   APOLLO SYSTEM — single-file PWA
   ============================================================ */

// ─── DATA ─────────────────────────────────────────────────────
const FACETS=[
 {key:"mind",numeral:"I",name:"The Mind",tagline:"Philosophical depth. The architecture of thought.",
  philosophy:"Your mind is the architecture within which everything else operates. Weak architecture reacts. Strong architecture generates.",
  practice:["15 min with Meditations — one entry, read twice.","Write one sentence on what resistance reveals.","Weekly essay (500–1000 words) for no audience."],
  enemy:"Opinions dressed as worldview."},
 {key:"craft",numeral:"II",name:"The Craft",tagline:"Spoken word mastery. The one-hour rule.",
  philosophy:"One primary skill, taken beyond denial. Not the best — the undeniable. Ten units in private for every one shown.",
  practice:["One hour of deliberate craft. Non-negotiable.","Record one performance daily. Watch back. Note one failure.","One master of the form per week."],
  enemy:"Performing the craft instead of building it."},
 {key:"body",numeral:"III",name:"The Body",tagline:"The physical argument. The discipline proof.",
  philosophy:"The visible proof your discipline is not theoretical. The room you change before you speak.",
  practice:["Train the six movements: push, pull, squat, hinge, core, locomotion.","Advance only at 3 sets × target reps × perfect form.","Recover with intent: sleep, water, protein, sun."],
  enemy:"Perfectionism over consistency."},
 {key:"interior",numeral:"IV",name:"The Interior World",tagline:"Morning pages. The iceberg beneath the surface.",
  philosophy:"The depth the public feels but cannot name. Built in genuine privacy — not privacy later photographed.",
  practice:["Morning pages: 3 pages longhand, unedited.","Evening silence: 10 minutes. No input. No output.","One weekly walk alone. Phone in pocket."],
  enemy:"Performing introspection."},
 {key:"code",numeral:"V",name:"The Code",tagline:"The personal law that supersedes approval.",
  philosophy:"Not a value statement. The thing you would rather lose everything to keep. Three lines maximum.",
  practice:["Read your code each morning. Out loud.","Name temptation in writing before breaking it.","Quarterly: rewrite it. Strengthen it."],
  enemy:"Confusing a mood for a philosophy."},
 {key:"knowledge",numeral:"VI",name:"The Knowledge",tagline:"Africa first. Then the world.",
  philosophy:"Build the architecture. Then furnish it. Malcolm X, Things Fall Apart, Meditations, The War of Art, Fanon.",
  practice:["Read 30 minutes minimum. Always.","Annotate. The clean book is the unread book.","One book per month. Finish it. Write a paragraph."],
  enemy:"Collecting books instead of finishing them."},
 {key:"aesthetic",numeral:"VII",name:"The Aesthetic & Presence",tagline:"Presence. Wardrobe. The room as a statement.",
  philosophy:"Dark foundation always. One warm amber or gold element. Fit over brand. The Apollo Circle pin on every outfit.",
  practice:["Dress with intention. No exceptions.","Carry the pin. Always.","Curate the room weekly. Discard what does not earn its place."],
  enemy:"Newness mistaken for quality."}
];

const RANKS=[
 {key:"E",title:"E — The Awakening",summary:"The system is new. The work is unmistakable. Survive Week 1.",
  grad:["14 consecutive days of daily architecture","Morning pages every day","Body training 3x/week without missing","The code written, posted somewhere only you see"]},
 {key:"D",title:"D — The Builder",summary:"The pattern stabilises. Output begins. Privately.",
  grad:["60 consecutive days of daily architecture","10 craft pieces produced (~1 shared)","Visible body change beginning","5 books finished and annotated"]},
 {key:"C",title:"C — The Operator",summary:"Income generating. Body changing. Mind sharpened.",
  grad:["Three income streams active and producing","Six months of consistent architecture","N$2,000 stability buffer built","First public craft shared with intent"]},
 {key:"B",title:"B — The Voice",summary:"The work begins to be recognised. The system holds under scale.",
  grad:["Monthly income exceeds N$12,000 consistently","Audience exists and engages, not just follows","Investment portfolio active","Code unchanged through one real test"]},
 {key:"A",title:"A — The Architect",summary:"You build categories. You set the room temperature.",
  grad:["Monthly income exceeds N$25,000","Brand generates revenue independent of direct labour","Investment portfolio above N$100,000","Mentorship downward begun"]},
 {key:"S",title:"S — Undeniable",summary:"Not a destination. A level of being from which you continue to build indefinitely.",
  grad:["The work does not stop. The standard only rises.","There is no graduation from S Rank."]}
];

const THE_CODE=[
 "I do not chase. I become.",
 "The work is the reward. The applause is residue.",
 "I will outwork my doubts in silence.",
 "I owe the world my discipline. Nothing more.",
 "Comfort is a slow grave. I refuse it.",
 "My word is law to myself before anyone else.",
 "I am building something the world has no name for yet."
];

const DAILY=[
 {id:"wake",time:"05:30",label:"Wake. No phone.",detail:"Water. Sunlight. Silence."},
 {id:"pages",time:"05:45",label:"Morning Pages",detail:"3 pages longhand. Unedited."},
 {id:"meditations",time:"06:15",label:"Meditations",detail:"One entry. Read twice."},
 {id:"train",time:"06:30",label:"Train the Body",detail:"Six movements. Progressive overload."},
 {id:"craft",time:"08:00",label:"The Craft — 1 Hour",detail:"Deliberate. Recorded. Reviewed."},
 {id:"income",time:"10:00",label:"Income Work",detail:"Jewellery, tutoring, or content services."},
 {id:"study",time:"14:00",label:"CA / Study Block",detail:"Two hours. No phone."},
 {id:"read",time:"19:00",label:"Read 30 Min",detail:"Annotate. The clean book is the unread book."},
 {id:"silence",time:"21:30",label:"Evening Silence",detail:"10 min. No music. No input. No output."},
 {id:"code",time:"22:00",label:"Read The Code",detail:"Out loud. Then sleep."}
];

const STREAMS=[
 {key:"jewellery",name:"The Jewellery Brand",margin:"85–93%",yr1:"N$20k–30k",
  plays:["Photograph every piece. EFT before dispatch.","3 Windhoek boutiques on 60/40 consignment.","Quarterly limited drops — 20–30 pieces in 48h."]},
 {key:"tutoring",name:"Academic Tutoring",margin:"100%",yr1:"N$15k–30k",
  plays:["Post in every NUST/UNAM group: N$100/hr.","Group sessions: 4 × N$60 = N$240/hr.","Three recurring weekly clients by Month 3."]},
 {key:"content",name:"Content & Brand Services",margin:"~95%",yr1:"N$25k–40k",
  plays:["Fiverr: low price, harvest reviews, raise after 10.","Convert one-offs into monthly retainers.","Position as Africa-first brand strategist."]}
];

const BUCKETS=[
 {key:"brand",name:"Brand Investment",pct:40},
 {key:"ops",name:"Business Operations",pct:20},
 {key:"invest",name:"Financial Investment",pct:20},
 {key:"buffer",name:"Savings Buffer",pct:10},
 {key:"personal",name:"Personal",pct:10}
];

const ROADMAP=[
 {y:"Year 1",inc:"N$60k–100k",note:"Three streams active. N$12–20k invested."},
 {y:"Year 2",inc:"N$150k–220k",note:"Brand recognised. Retainer book stable."},
 {y:"Year 3",inc:"N$250k–400k",note:"Portfolio building. Public work scales."},
 {y:"Year 4",inc:"N$400k–600k",note:"Investment income begins to matter."},
 {y:"Year 5",inc:"N$600k+",note:"CA qualified. Portfolio N$500k–800k. Generational base."}
];

const RULES=[
 {n:"I",t:"Income before investment",b:"N$500 invested from N$5,000 monthly is real compounding. N$500 from one irregular payment is noise."},
 {n:"II",t:"The percentage, not the amount",b:"Allocate the moment money arrives. Five buckets. Every rand."},
 {n:"III",t:"Pay yourself first",b:"The percentage goes to savings/investment first. Not what is left over. The first cut."}
];

const CIRCLE=[
 ["The Mentor","5–10 years ahead in your craft. Pays attention enough to correct you."],
 ["The Peer","Running their own race at your pace. You sharpen each other."],
 ["The Builder","A friend in a different field who builds with the same intensity."],
 ["The Honest One","Will tell you when the work is weak. Will not flatter you."],
 ["The Cut","People who cost you energy and return nothing. Distance, then absence."]
];

// ─── STATE ────────────────────────────────────────────────────
const KEY="apollo.state.v2";
const todayISO=()=>new Date().toISOString().slice(0,10);
const initial={
  rank:"E",
  facets:Object.fromEntries(FACETS.map(f=>[f.key,5])),
  daily:{},      // {dateISO:{blocks:{id:bool}}}
  codeCheck:{},
  income:[],     // {id,date,stream,amount,note}
  buckets:{brand:0,ops:0,invest:0,buffer:0,personal:0},
  streak:{current:0,best:0,lastDate:null},
  rankCond:{}    // "E:0":true
};

function load(){
  try{const r=localStorage.getItem(KEY);if(!r)return structuredClone(initial);
    const p=JSON.parse(r);return Object.assign(structuredClone(initial),p,{
      facets:Object.assign({},initial.facets,p.facets||{}),
      buckets:Object.assign({},initial.buckets,p.buckets||{})
    });}
  catch(e){return structuredClone(initial);}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
let state=load();
let tab=location.hash.replace("#","")||"home";

// ─── ACTIONS ──────────────────────────────────────────────────
function setFacet(k,v,skipRender){state.facets[k]=Math.max(0,Math.min(100,v|0));save();if(!skipRender)render();}
function toggleBlock(id){
  const d=todayISO();
  state.daily[d]=state.daily[d]||{blocks:{}};
  state.daily[d].blocks[id]=!state.daily[d].blocks[id];
  const done=Object.values(state.daily[d].blocks).filter(Boolean).length>=7;
  if(done && state.streak.lastDate!==d){
    const y=new Date();y.setDate(y.getDate()-1);
    const yi=y.toISOString().slice(0,10);
    const cur=state.streak.lastDate===yi?state.streak.current+1:1;
    state.streak={current:cur,best:Math.max(state.streak.best,cur),lastDate:d};
  }
  save();render();
}
function toggleCode(){const d=todayISO();state.codeCheck[d]=!state.codeCheck[d];save();render();}
function addIncome(stream,amount,note){
  if(!amount||amount<=0)return;
  const id=Math.random().toString(36).slice(2,10);
  state.income.unshift({id,date:todayISO(),stream,amount,note:note||""});
  state.income=state.income.slice(0,500);
  BUCKETS.forEach(b=>state.buckets[b.key]=(state.buckets[b.key]||0)+amount*b.pct/100);
  save();render();
}
function removeIncome(id){
  const t=state.income.find(e=>e.id===id);if(!t)return;
  BUCKETS.forEach(b=>state.buckets[b.key]=Math.max(0,(state.buckets[b.key]||0)-t.amount*b.pct/100));
  state.income=state.income.filter(e=>e.id!==id);save();render();
}
function setRank(k){state.rank=k;save();render();}
function toggleRankCond(k,i){const key=k+":"+i;state.rankCond[key]=!state.rankCond[key];save();render();}

function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="apollo-state-"+todayISO()+".json";a.click();
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);state=Object.assign(structuredClone(initial),p);save();render();alert("Imported.");}catch(e){alert("Import failed.");}};
  r.readAsText(file);
}
function resetAll(){if(confirm("Erase all Apollo data?")){state=structuredClone(initial);save();render();}}

// ─── HELPERS ──────────────────────────────────────────────────
const $=(s,el=document)=>el.querySelector(s);
const fmt=n=>"N$"+(n||0).toLocaleString("en-NA",{maximumFractionDigits:0});
const todayBlocks=()=>(state.daily[todayISO()]?.blocks)||{};
const overall=()=>{const v=Object.values(state.facets);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);};
const rankIdx=k=>RANKS.findIndex(r=>r.key===k);
const totalIncome=()=>state.income.reduce((a,e)=>a+e.amount,0);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ─── VIEWS ────────────────────────────────────────────────────
function viewHome(){

    <header class="brand">
      <div class="brand-title">APOLLO <em class="gold-grad">·</em> SYSTEM</div>
      <div class="pill gold">RANK ${state.rank}</div>
    </header>

    <div class="card">
      <div class="row" style="gap:18px;">
        <div class="ring" style="--p:${pct}">
          <div><div class="rank gold-grad">${state.rank}</div><div class="lbl">Today ${pct}%</div></div>
        </div>
        <div style="flex:1;">
          <div class="tiny">Daily Architecture</div>
          <div style="font-family:var(--font-display);font-size:18px;margin-top:4px;">${done} / ${DAILY.length} complete</div>
          <div class="bar" style="margin-top:10px;"><span style="width:${pct}%"></span></div>
          <div class="row" style="margin-top:12px;gap:14px;">
            <div><div class="tiny">Streak</div><div class="num" style="color:var(--gold);font-size:18px;">${state.streak.current}d</div></div>
            <div><div class="tiny">Best</div><div class="num" style="font-size:18px;">${state.streak.best}d</div></div>
            <div><div class="tiny">Overall</div><div class="num" style="font-size:18px;">${overall()}</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:12px;">
        <div><div class="tiny">The Daily Architecture</div><h3 style="font-size:18px;margin-top:4px;">Today's Protocol</h3></div>
        <div class="pill">${todayISO()}</div>
      </div>
      <div class="stack">
        ${DAILY.map(b=>`
          <button class="check ${blocks[b.id]?'done':''}" data-block="${b.id}">
            <span class="box"></span>
            <span style="flex:1;">
              <span class="time">${b.time}</span>
              <div class="label">${b.label}</div>
              <div class="detail">${b.detail}</div>
            </span>
          </button>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:12px;">
        <div><div class="tiny">The Code</div><h3 style="font-size:18px;margin-top:4px;">Read out loud.</h3></div>
        <button class="pill ${codeDone?'gold':''}" id="codeBtn">${codeDone?'✓ Read today':'Mark read'}</button>
      </div>
      ${THE_CODE.map(l=>`<div class="code-line">${l}</div>`).join("")}
    </div>
  `;
}

function viewSystem(){
  return `
    <header class="brand"><div class="brand-title">THE SEVEN <em class="gold-grad">·</em> FACETS</div><div class="pill">VII</div></header>

    <div class="card">
      <div class="tiny">The System</div>
      <h3 style="font-size:18px;margin-top:4px;">Seven facets. One man.</h3>
      <p class="mut small" style="margin-top:8px;">Mind, Craft, Body, Interior, Code, Knowledge, Aesthetic. Each rated 0–100 by you, honestly.</p>
    </div>

    ${FACETS.map(f=>`
      <div class="facet">
        <div class="numeral">${f.numeral}</div>
        <div style="flex:1;">
          <div class="row-between">
            <div><div class="name">${f.name}</div><div class="tag">${f.tagline}</div></div>
            <div class="num gold-grad" style="font-size:20px;" id="fval-${f.key}">${state.facets[f.key]}</div>
          </div>

            <button class="stepper__btn" data-facet-dec="${f.key}">−</button>

              <div class="stepper__val" id="fnum-${f.key}">${state.facets[f.key]}</div>

            </div>

          </div>

      <div class="stack" style="margin-top:12px;">
        ${CIRCLE.map(([r,d])=>`<div><div style="font-family:var(--font-display);font-size:14px;color:var(--gold);">${r}</div><div class="small mut">${d}</div></div>`).join("")}

  const tot=totalIncome();
  return `
    <header class="brand"><div class="brand-title">THE <em class="gold-grad">·</em> BLUEPRINT</div><div class="pill gold">${fmt(tot)}</div></header>

    <div class="card">
      <div class="tiny">Total Income Logged</div>
      <div class="gold-grad" style="font-family:var(--font-display);font-size:36px;margin-top:4px;">${fmt(tot)}</div>
      <div class="mut small">${state.income.length} entries · auto-allocated across 5 buckets</div>
    </div>

    <div class="card">
      <div class="tiny">The Five Buckets</div>
      <h3 style="font-size:16px;margin-top:4px;">Every rand. The first cut.</h3>
      <div style="margin-top:8px;">
        ${BUCKETS.map(b=>`
          <div class="bucket">
            <div><div class="name">${b.name}</div><div class="pct">${b.pct}%</div></div>

      </div>
    </div>

    <div class="card">

      <div class="stack" style="margin-top:12px;">

          <select class="inp" id="incStream">
            <option value="jewellery">Jewellery</option>

      </div>
    </div>

    ${state.income.length?`
      <div class="card">
        <div class="tiny" style="margin-bottom:8px;">Recent Income</div>
        ${state.income.slice(0,20).map(e=>`
          <div class="inc">
            <div><div style="font-family:var(--font-display);font-size:13px;">${e.stream}</div>
              <div class="meta">${e.date}${e.note?' · '+escape(e.note):''}</div></div>
            <div class="row"><div class="amt">${fmt(e.amount)}</div><button class="del" data-del="${e.id}">Remove</button></div>
          </div>`).join("")}
      </div>`:''}

    <div class="card">
      <div class="tiny">Three Streams</div>
      <div class="stack" style="margin-top:10px;">
        ${STREAMS.map(s=>`<div>
          <div class="row-between"><div style="font-family:var(--font-display);font-size:14px;">${s.name}</div><div class="pill">${s.margin} · ${s.yr1}</div></div>
          <ul class="ul-clean">${s.plays.map(p=>`<li>${p}</li>`).join("")}</ul>
        </div>`).join('<div class="hr-rule"></div>')}
      </div>
    </div>

    <div class="card">
      <div class="tiny">Wealth Roadmap</div>
      <div class="stack" style="margin-top:10px;">
        ${ROADMAP.map(r=>`<div class="row-between"><div><div style="font-family:var(--font-display);color:var(--gold);">${r.y}</div><div class="small mut">${r.note}</div></div><div class="num">${r.inc}</div></div>`).join('<div class="hr-rule"></div>')}
      </div>
    </div>

    <div class="card">
      <div class="tiny">Three Wealth Rules</div>
      <div class="stack" style="margin-top:10px;">
        ${RULES.map(r=>`<div><div style="font-family:var(--font-display);color:var(--gold);font-size:13px;">${r.n}. ${r.t}</div><p class="small mut" style="margin-top:4px;">${r.b}</p></div>`).join("")}
      </div>
    </div>
  `;
}

function viewRank(){
  const ci=rankIdx(state.rank);
  return `
    <header class="brand"><div class="brand-title">RANK <em class="gold-grad">·</em> PROGRESSION</div><div class="pill gold">CURRENT ${state.rank}</div></header>

    <div class="card">
      <div class="scroll-x">
        ${RANKS.map(r=>`<button class="chip ${r.key===state.rank?'on':''}" data-rank="${r.key}">${r.key}</button>`).join("")}
      </div>
      <p class="small mut" style="margin-top:10px;">E → D → C → B → A → S. Each rank graduates only when its conditions are honestly met.</p>
    </div>

    ${RANKS.map((r,i)=>`
      <div class="rank-row ${r.key===state.rank?'active':''}">
        <div class="badge">${r.key}</div>
        <div style="flex:1;">
          <div class="row-between">
            <div style="font-family:var(--font-display);font-size:15px;">${r.title}</div>
            ${i<=ci?`<div class="pill gold">Reached</div>`:`<div class="pill">Locked</div>`}
          </div>
          <p class="small mut" style="margin-top:4px;">${r.summary}</p>
          <div class="tiny" style="margin-top:10px;">Graduation Conditions</div>
          <div class="stack" style="margin-top:6px;">
            ${r.grad.map((g,gi)=>{const on=state.rankCond[r.key+":"+gi];return `
              <button class="check ${on?'done':''}" data-rcond="${r.key}:${gi}"><span class="box"></span><span class="label" style="font-family:var(--font-serif);font-size:13px;">${g}</span></button>`;}).join("")}
          </div>
          ${r.key!==state.rank?`<button class="btn btn-ghost" data-setrank="${r.key}" style="margin-top:10px;width:100%;">Set as current rank</button>`:""}
        </div>
      </div>`).join("")}
  `;
}

function viewVault(){
  return `
    <header class="brand"><div class="brand-title">THE <em class="gold-grad">·</em> VAULT</div><div class="pill">DATA</div></header>

    <div class="card">
      <div class="tiny">Storage</div>
      <h3 style="font-size:16px;margin-top:4px;">Everything lives on this device.</h3>
      <p class="small mut" style="margin-top:6px;">No accounts. No cloud. Export to back up. Import to restore.</p>
      <div class="grid-2" style="margin-top:14px;">
        <button class="btn btn-gold" id="exp">Export JSON</button>
        <label class="btn">Import JSON<input id="imp" type="file" accept="application/json" style="display:none" /></label>
      </div>
      <div class="hr-rule"></div>
      <button class="btn btn-danger" id="rst" style="width:100%;">Reset all data</button>
    </div>

    <div class="card">
      <div class="tiny">At a Glance</div>
      <div class="stack" style="margin-top:10px;">
        <div class="row-between"><span class="mut small">Rank</span><span class="num">${state.rank}</span></div>
        <div class="row-between"><span class="mut small">Overall facet score</span><span class="num">${overall()}</span></div>
        <div class="row-between"><span class="mut small">Current streak</span><span class="num">${state.streak.current}d</span></div>
        <div class="row-between"><span class="mut small">Best streak</span><span class="num">${state.streak.best}d</span></div>
        <div class="row-between"><span class="mut small">Income entries</span><span class="num">${state.income.length}</span></div>
        <div class="row-between"><span class="mut small">Total income</span><span class="num">${fmt(totalIncome())}</span></div>
      </div>
    </div>

    <div class="card">
      <div class="tiny">The Apollo Code</div>
      <div class="stack" style="margin-top:10px;">${THE_CODE.map(l=>`<div class="code-line">${l}</div>`).join("")}</div>
    </div>
  `;
}

// ─── RENDER ───────────────────────────────────────────────────
function render(){
  const v={home:viewHome,system:viewSystem,money:viewMoney,rank:viewRank,vault:viewVault}[tab]||viewHome;
  $("#app").innerHTML=v();
  document.querySelectorAll("#nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===tab);
  });
  bind();
  window.scrollTo({top:0,behavior:"instant"});
}

function bind(){
  document.querySelectorAll("[data-block]").forEach(el=>el.onclick=()=>toggleBlock(el.dataset.block));
  // Stepper − buttons
  document.querySelectorAll("[data-facet-dec]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.facetDec;
    setFacet(k,state.facets[k]-5,true);
    syncStepper(k);
  });
  // Stepper + buttons
  document.querySelectorAll("[data-facet-inc]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.facetInc;
    setFacet(k,state.facets[k]+5,true);
    syncStepper(k);
  });
  // Rank chips: visual highlight only (don't mutate state.rank)
  document.querySelectorAll("[data-rank]").forEach(el=>el.onclick=()=>{
    document.querySelectorAll("[data-rank]").forEach(c=>c.classList.remove("on"));
    el.classList.add("on");
  });
  document.querySelectorAll("[data-setrank]").forEach(el=>el.onclick=()=>setRank(el.dataset.setrank));
  document.querySelectorAll("[data-rcond]").forEach(el=>el.onclick=()=>{const[k,i]=el.dataset.rcond.split(":");toggleRankCond(k,+i);});
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>removeIncome(el.dataset.del));
  const cb=$("#codeBtn");if(cb)cb.onclick=toggleCode;
  const ib=$("#incBtn");if(ib)ib.onclick=()=>{
    const s=$("#incStream").value,a=+$("#incAmount").value,n=$("#incNote").value;
    if(a>0){addIncome(s,a,n);$("#incAmount").value="";$("#incNote").value="";}
  };
  const ex=$("#exp");if(ex)ex.onclick=exportJSON;
  const im=$("#imp");if(im)im.onchange=e=>e.target.files[0]&&importJSON(e.target.files[0]);
  const rs=$("#rst");if(rs)rs.onclick=resetAll;
}

function syncStepper(k){
  const v=state.facets[k];
  const num=document.getElementById("fnum-"+k);
  const bar=document.getElementById("fbar-"+k);
  const val=document.getElementById("fval-"+k);
  if(num)num.textContent=v;
  if(bar)bar.style.width=v+"%";
  if(val)val.textContent=v;
}

document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick=()=>{tab=b.dataset.tab;location.hash=tab;render();};
});
window.addEventListener("hashchange",()=>{tab=location.hash.replace("#","")||"home";render();});

render();

// ─── PWA REGISTRATION ─────────────────────────────────────────
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
</script>
